# Tuned for a 512MB single-container deploy where the Solid Queue supervisor,
# dispatcher and worker are all forked inside Puma (SOLID_QUEUE_IN_PUMA).
# The stock settings poll the queue database ten times a second and claim in
# batches of 500 — a lot of allocation churn and DB round trips on this box
# for a queue that is almost always empty.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 100
  workers:
    - queues: "*"
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # 0.5s instead of 0.1s: 5x fewer polls, at the cost of up to half a
      # second before an OTP SMS job gets picked up.
      polling_interval: 0.5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
