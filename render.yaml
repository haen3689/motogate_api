# render.yaml Blueprint configuration for Render.com
# See https://render.com/docs/blueprint-spec for options

databases:
  - name: motogate-db
    databaseName: motogate_api_production
    user: motogate_user
    plan: starter # or 'free' depending on your Render plan

services:
  - type: web
    name: motogate-api
    runtime: docker
    region: singapore # Choose singapore, oregon, frankfurt, or ohio
    plan: starter # or 'free'
    dockerfilePath: ./Dockerfile
    # Thruster (front) listens on 8080 and proxies to Puma on 3000 internally.
    # Without this, Render's port auto-detection can pick 3000 instead of the
    # externally-reachable 8080, causing every request to time out and reset.
    port: 8080
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: motogate-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MASTER_KEY
        value: 7a693193a36d9da594adacd3cbb93959
      - key: PORT
        value: "8080"
      - key: HTTP_PORT
        value: "8080"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_VISION_API_KEY
        value: AIzaSyAANvNR2UOfx8K84dAv2ztHHKYE8qv_YH0
      - key: TELBIZ_API_URL
        value: https://api.telbiz.la/sms/send
      - key: TELBIZ_CLIENT_ID
        value: "17300867325554841"
      - key: TELBIZ_SECRET
        value: eae747c0-356e-4338-886e-6464789083fc
      - key: TELBIZ_SENDER
        value: MotoGate
      # Cloudflare R2 (Active Storage) — set these manually in the Render
      # dashboard, not here, since they're secrets. Required for uploaded
      # photos to survive deploys (local disk storage does not).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

      # BCEL OnePay (app/services/payments/bcel_one_pay) — set these
      # manually in the Render dashboard once BCEL issues production
      # merchant credentials. Until set, the code falls back to BCEL's
      # published TEST merchant, so payments work against sandbox out of
      # the box. BCEL_PRIVATE_KEY_PEM is our own RSA key used to sign
      # void/refund requests — its matching PUBLIC key must be emailed to
      # BCEL (phayudon@bcel.com.la) before void/refund calls will work.
      - key: BCEL_MCID
        sync: false
      - key: BCEL_MCC
        sync: false
      - key: BCEL_SHOPCODE
        sync: false
      - key: BCEL_CCY
        sync: false
      - key: BCEL_COUNTRY
        sync: false
      - key: BCEL_PROVINCE
        sync: false
      - key: BCEL_PRIVATE_KEY_PEM
        sync: false
